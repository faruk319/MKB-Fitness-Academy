<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Kids Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">DAY 2</h1>
            <p class="subtitle">🏃 Cardio Fun Time! 🏃</p>
        </div>
        
        <div class="exercise-grid">
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/06running.png" alt="Running exercise"></div>
                <div class="exercise-name">Running</div>
                <div class="exercise-desc">Run fast like the wind!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/07stretching.png" alt="Stretching exercise"></div>
                <div class="exercise-name">Stretching</div>
                <div class="exercise-desc">Stretch your body tall!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/08bridgelift.png" alt="Bridge exercise"></div>
                <div class="exercise-name">Bridge Lift</div>
                <div class="exercise-desc">Make a bridge with your body!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/09backstretch.png" alt="Backstretch exercise"></div>
                <div class="exercise-name">Backstretch</div>
                <div class="exercise-desc">Stretch your back muscles!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/10squats.png" alt="Squat exercise"></div>
                <div class="exercise-name">Squats</div>
                <div class="exercise-desc">Sit down and stand up!</div>
            </div>
        </div>
        
        <div class="nav">
            <a href="day1.html">← Previous Day</a>
            <a href="home.html">🏠 Home</a>
            <a href="day3.html">Next Day →</a>
