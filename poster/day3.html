<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3 - Kids Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">DAY 3</h1>
            <p class="subtitle">🤸 Jump & Move Fun! 🤸</p>
        </div>
        
        <div class="exercise-grid">
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/11skipping.png" alt="Skipping exercise"></div>
                <div class="exercise-name">Skipping</div>
                <div class="exercise-desc">Skip rope and have fun!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/12overheadshoulderstretch.png" alt="Shoulder stretch exercise"></div>
                <div class="exercise-name">Overhead Shoulder Stretch</div>
                <div class="exercise-desc">Stretch your shoulders up high!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/13armcircle.png" alt="Arm circle exercise"></div>
                <div class="exercise-name">Arm Circle</div>
                <div class="exercise-desc">Make big circles with your arms!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/14jumpingjack.png" alt="Jumping jack exercise"></div>
                <div class="exercise-name">Jumping Jack</div>
                <div class="exercise-desc">Jump and spread your arms!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/15sidetwist.png" alt="Side twist exercise"></div>
                <div class="exercise-name">Side Twists</div>
                <div class="exercise-desc">Twist your body left and right!</div>
            </div>
        </div>
