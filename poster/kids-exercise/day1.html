<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - Kids Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">DAY 1</h1>
            <p class="subtitle">🌟 5 Fun Exercises for Today! 🌟</p>
        </div>
        
        <div class="exercise-grid">
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/01plank.png" alt="Plank exercise"></div>
                <div class="exercise-name">Planks</div>
                <div class="exercise-desc">Hold your body straight like a board!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/02pushup.png" alt="Push-up exercise"></div>
                <div class="exercise-name">Push-ups</div>
                <div class="exercise-desc">Push your body up and down!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/03crunch.png" alt="Crunch exercise"></div>
                <div class="exercise-name">Crunches</div>
                <div class="exercise-desc">Sit up and strengthen your tummy!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/04cycling.png" alt="Cycling exercise"></div>
                <div class="exercise-name">Cycling</div>
                <div class="exercise-desc">Pedal like you're riding a bike!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/05lunge.png" alt="Lunge exercise"></div>
                <div class="exercise-name">Lunges</div>
                <div class="exercise-desc">Step forward and bend your knees!</div>
            </div>
        </div>
        
        <div class="nav">
            <a href="home.html">🏠 Home</a>
            <a href="day2.html">Next Day →</a>
        </div>
    </div>
</body>
</html>
