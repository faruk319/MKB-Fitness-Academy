<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7 - Kids Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">DAY 7</h1>
            <p class="subtitle">🐸 Animal Poses & Jumps! 🐸</p>
        </div>
        
        <div class="exercise-grid">
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/31toesjump.png" alt="Toes jump exercise"></div>
                <div class="exercise-name">Toes Jump</div>
                <div class="exercise-desc">Jump up on your tippy toes!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/32frontsidejump.png" alt="Front side jump exercise"></div>
                <div class="exercise-name">Front Side Jump</div>
                <div class="exercise-desc">Jump forward and to the side!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/33frogpose.png" alt="Frog pose exercise"></div>
                <div class="exercise-name">Frog Pose</div>
                <div class="exercise-desc">Squat down like a little frog!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/34butterflypose.png" alt="Butterfly pose exercise"></div>
                <div class="exercise-name">Butterfly Pose</div>
                <div class="exercise-desc">Sit and flap your legs like wings!</div>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-img"><img src="img/35dogpose.png" alt="Dog pose exercise"></div>
                <div class="exercise-name">Dog Pose</div>
                <div class="exercise-desc">Get on all fours like a happy dog!</div>
            </div>
        </div>
